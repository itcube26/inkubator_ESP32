; Платформа-конфиг для проверки сборки в PlatformIO / Arduino CLI.
; Если прошиваете через Arduino IDE — этот файл можно игнорировать,
; просто откройте incubator_web/incubator_web.ino.

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
lib_deps =
    adafruit/DHT sensor library@^1.4.6
    adafruit/Adafruit SSD1306@^2.5.9
    adafruit/Adafruit GFX Library@^1.11.9
    waspinator/AccelStepper@^1.6.1
build_flags =
    -DARDUINO_USB_CDC_ON_BOOT=0
